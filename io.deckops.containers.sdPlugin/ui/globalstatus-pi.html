<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Global Status Settings</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #2D2D2D;
      color: #E8E8E8;
      font-size: 12px;
    }

    .info-box {
      background: rgba(13,183,237,0.1);
      border: 1px solid rgba(13,183,237,0.3);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .info-title {
      font-size: 13px;
      font-weight: 600;
      color: #0db7ed;
      margin-bottom: 8px;
    }

    .info-text {
      font-size: 11px;
      color: #aaa;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="info-box">
    <div class="info-title">🐳 Global Docker Status</div>
    <div class="info-text">
      This action opens a dashboard showing all containers from all configured servers.
      <br><br>
      Click the button to view:
      <ul style="margin: 8px 0; padding-left: 20px;">
        <li>All Docker servers (as tabs)</li>
        <li>Running containers per server</li>
        <li>Container health and status</li>
        <li>Real-time updates</li>
      </ul>
      No configuration needed!
    </div>
  </div>
</body>
</html>
