<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Manager - Debug Logs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }

    .header h1 {
      font-size: 24px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1::before {
      content: "🐳";
      font-size: 28px;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #2d2d44;
      color: #e0e0e0;
      border: 1px solid #444;
    }

    .btn-secondary:hover {
      background: #3d3d54;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: white;
    }

    .btn-danger:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 65, 108, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .stat-label {
      color: #888;
    }

    .stat-value {
      font-weight: 600;
      color: #fff;
    }

    .stat-info { color: #4CAF50; }
    .stat-warn { color: #FF9800; }
    .stat-error { color: #F44336; }
    .stat-debug { color: #2196F3; }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      border: 1px solid #444;
      background: transparent;
      color: #888;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: #667eea;
      border-color: #667eea;
      color: white;
    }

    .filter-btn:hover:not(.active) {
      border-color: #667eea;
      color: #667eea;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
    }

    .search-box:focus {
      outline: none;
      border-color: #667eea;
    }

    .logs-container {
      background: #0d0d1a;
      border-radius: 10px;
      padding: 0;
      max-height: calc(100vh - 280px);
      overflow-y: auto;
      border: 1px solid #222;
    }

    .log-entry {
      padding: 8px 15px;
      border-bottom: 1px solid #1a1a2e;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      display: flex;
      gap: 10px;
      transition: background 0.15s ease;
    }

    .log-entry:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-timestamp {
      color: #666;
      white-space: nowrap;
      min-width: 180px;
    }

    .log-level {
      font-weight: 600;
      min-width: 50px;
      text-transform: uppercase;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      text-align: center;
    }

    .log-level.info {
      background: rgba(76, 175, 80, 0.2);
      color: #4CAF50;
    }

    .log-level.warn {
      background: rgba(255, 152, 0, 0.2);
      color: #FF9800;
    }

    .log-level.error {
      background: rgba(244, 67, 54, 0.2);
      color: #F44336;
    }

    .log-level.debug {
      background: rgba(33, 150, 243, 0.2);
      color: #2196F3;
    }

    .log-source {
      color: #9c27b0;
      min-width: 100px;
    }

    .log-message {
      flex: 1;
      word-break: break-word;
      color: #e0e0e0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    .empty-state h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #888;
    }

    .copied-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .copied-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .auto-refresh {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
    }

    .auto-refresh input {
      cursor: pointer;
    }

    .last-update {
      font-size: 11px;
      color: #666;
    }

    /* Scrollbar styling */
    .logs-container::-webkit-scrollbar {
      width: 8px;
    }

    .logs-container::-webkit-scrollbar-track {
      background: #1a1a2e;
    }

    .logs-container::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    .logs-container::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Docker Manager Debug Logs</h1>
      <div class="button-group">
        <button class="btn btn-primary" onclick="copyAllLogs()">
          📋 Copy All Logs
        </button>
        <button class="btn btn-secondary" onclick="refreshLogs()">
          🔄 Refresh
        </button>
        <button class="btn btn-danger" onclick="clearLogs()">
          🗑️ Clear
        </button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">Total:</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Info:</span>
        <span class="stat-value stat-info" id="infoCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Warn:</span>
        <span class="stat-value stat-warn" id="warnCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Error:</span>
        <span class="stat-value stat-error" id="errorCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Debug:</span>
        <span class="stat-value stat-debug" id="debugCount">0</span>
      </div>
      <div style="flex: 1;"></div>
      <div class="auto-refresh">
        <input type="checkbox" id="autoRefresh" checked>
        <label for="autoRefresh">Auto-refresh</label>
      </div>
      <div class="last-update" id="lastUpdate">Last update: --</div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="info" onclick="setFilter('info')">Info</button>
      <button class="filter-btn" data-filter="warn" onclick="setFilter('warn')">Warn</button>
      <button class="filter-btn" data-filter="error" onclick="setFilter('error')">Error</button>
      <button class="filter-btn" data-filter="debug" onclick="setFilter('debug')">Debug</button>
      <input type="text" class="search-box" id="searchBox" placeholder="Search logs..." oninput="filterLogs()">
    </div>

    <div class="logs-container" id="logsContainer">
      <div class="empty-state">
        <h2>Loading logs...</h2>
        <p>Fetching debug information from the plugin</p>
      </div>
    </div>
  </div>

  <div class="copied-toast" id="copiedToast">
    ✓ Logs copied to clipboard!
  </div>

  <script>
    let allLogs = [];
    let currentFilter = 'all';
    let refreshInterval = null;

    // Load logs from the JSON file
    async function loadLogs() {
      try {
        // Add cache-busting parameter
        const response = await fetch('debug-logs-data.json?' + Date.now());
        if (response.ok) {
          const data = await response.json();
          allLogs = data.logs || [];
          renderLogs();
          updateStats();
          document.getElementById('lastUpdate').textContent = 'Last update: ' + new Date().toLocaleTimeString();
        }
      } catch (error) {
        console.error('Failed to load logs:', error);
        document.getElementById('logsContainer').innerHTML = `
          <div class="empty-state">
            <h2>No logs available</h2>
            <p>Press the Debug Logs button on your Stream Deck to refresh</p>
          </div>
        `;
      }
    }

    function renderLogs() {
      const container = document.getElementById('logsContainer');
      const searchTerm = document.getElementById('searchBox').value.toLowerCase();

      const filteredLogs = allLogs.filter(log => {
        // Filter by level
        if (currentFilter !== 'all' && log.level !== currentFilter) {
          return false;
        }
        // Filter by search term
        if (searchTerm) {
          const searchable = `${log.message} ${log.source}`.toLowerCase();
          if (!searchable.includes(searchTerm)) {
            return false;
          }
        }
        return true;
      });

      if (filteredLogs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No logs found</h2>
            <p>${allLogs.length > 0 ? 'Try adjusting your filters' : 'No logs have been recorded yet'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredLogs.map(log => `
        <div class="log-entry">
          <span class="log-timestamp">${formatTimestamp(log.timestamp)}</span>
          <span class="log-level ${log.level}">${log.level}</span>
          <span class="log-source">[${log.source}]</span>
          <span class="log-message">${escapeHtml(log.message)}</span>
        </div>
      `).join('');

      // Scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    function updateStats() {
      const counts = {
        total: allLogs.length,
        info: allLogs.filter(l => l.level === 'info').length,
        warn: allLogs.filter(l => l.level === 'warn').length,
        error: allLogs.filter(l => l.level === 'error').length,
        debug: allLogs.filter(l => l.level === 'debug').length
      };

      document.getElementById('totalCount').textContent = counts.total;
      document.getElementById('infoCount').textContent = counts.info;
      document.getElementById('warnCount').textContent = counts.warn;
      document.getElementById('errorCount').textContent = counts.error;
      document.getElementById('debugCount').textContent = counts.debug;
    }

    function formatTimestamp(isoString) {
      const date = new Date(isoString);
      return date.toLocaleString();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setFilter(filter) {
      currentFilter = filter;

      // Update button states
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });

      renderLogs();
    }

    function filterLogs() {
      renderLogs();
    }

    function copyAllLogs() {
      const logsText = allLogs.map(log => {
        return `[${log.timestamp}] [${log.level.toUpperCase()}] [${log.source}] ${log.message}`;
      }).join('\n');

      // Add header with system info
      const header = `=== Docker Manager Debug Logs ===
Exported: ${new Date().toISOString()}
Total logs: ${allLogs.length}
================================

`;

      navigator.clipboard.writeText(header + logsText).then(() => {
        showToast();
      }).catch(err => {
        console.error('Failed to copy:', err);
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = header + logsText;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast();
      });
    }

    function showToast() {
      const toast = document.getElementById('copiedToast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function refreshLogs() {
      loadLogs();
    }

    function clearLogs() {
      if (confirm('Are you sure you want to clear all logs?')) {
        allLogs = [];
        renderLogs();
        updateStats();
      }
    }

    // Setup auto-refresh
    function setupAutoRefresh() {
      const checkbox = document.getElementById('autoRefresh');

      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          refreshInterval = setInterval(loadLogs, 2000);
        } else {
          clearInterval(refreshInterval);
        }
      });

      // Start auto-refresh
      refreshInterval = setInterval(loadLogs, 2000);
    }

    // Initial load
    loadLogs();
    setupAutoRefresh();
  </script>
</body>
</html>
