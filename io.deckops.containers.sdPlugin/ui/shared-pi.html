<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Docker Manager Settings</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #2D2D2D;
      color: #E8E8E8;
      font-size: 12px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #1E1E1E;
      border-bottom: 1px solid #3C3C3C;
    }
    .tab {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: #9B9B9B;
      transition: all 0.2s;
    }
    .tab:hover { color: #E8E8E8; }
    .tab.active {
      color: #0db7ed;
      border-bottom-color: #0db7ed;
    }

    /* Content */
    .tab-content {
      display: none;
      padding: 16px;
      max-height: 400px;
      overflow-y: auto;
    }
    .tab-content.active { display: block; }

    /* Form elements */
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      color: #9B9B9B;
      margin-bottom: 4px;
    }
    .form-hint {
      font-size: 10px;
      color: #666;
      margin-top: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #3C3C3C;
      border-radius: 4px;
      background: #1E1E1E;
      color: #E8E8E8;
      font-size: 12px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0db7ed;
    }
    textarea { resize: vertical; min-height: 80px; }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #0db7ed;
      color: white;
    }
    .btn-primary:hover { background: #0a9fd4; }
    .btn-secondary {
      background: #3C3C3C;
      color: #E8E8E8;
    }
    .btn-secondary:hover { background: #4C4C4C; }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    /* Section */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin: 16px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid #3C3C3C;
      color: #0db7ed;
    }
    .section-title:first-child { margin-top: 0; }

    /* Status */
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-top: 8px;
    }
    .status-success { background: #1E4620; color: #4CAF50; }
    .status-error { background: #4A1E1E; color: #F44336; }
    .status-info { background: #1E3A5F; color: #2196F3; }

    /* Container list */
    .container-list {
      max-height: 200px;
      overflow-y: auto;
      background: #1E1E1E;
      border: 1px solid #3C3C3C;
      border-radius: 4px;
      margin-top: 8px;
    }
    .container-item {
      padding: 10px 12px;
      border-bottom: 1px solid #3C3C3C;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .container-item:hover { background: #333; }
    .container-item:last-child { border-bottom: none; }
    .container-item.selected { background: #0db7ed22; }
    .container-name { font-weight: 500; }
    .container-state {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .container-state.running { background: #1E4620; color: #4CAF50; }
    .container-state.stopped { background: #4A1E1E; color: #F44336; }

    /* GitHub import */
    .github-import {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .github-import input { flex: 1; }

    /* Hidden */
    .hidden { display: none !important; }

    /* Inline form */
    .inline-form {
      display: flex;
      gap: 8px;
    }
    .inline-form input { flex: 1; }
  </style>
</head>
<body>
  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="server">Server</div>
    <div class="tab" data-tab="container">Container</div>
    <div class="tab" data-tab="action">Action</div>
  </div>

  <!-- Server Tab -->
  <div class="tab-content active" id="tab-server">
    <div class="section-title">Connection</div>

    <div class="form-group">
      <label class="form-label">Connection Type</label>
      <select id="connectionType">
        <option value="ssh">SSH (Recommended)</option>
        <option value="docker-api">Docker API (TCP)</option>
      </select>
    </div>

    <!-- SSH Settings -->
    <div id="ssh-settings">
      <div class="form-group">
        <label class="form-label">Host</label>
        <input type="text" id="sshHost" placeholder="192.168.1.100 or unraid.local">
      </div>

      <div class="form-group">
        <label class="form-label">Port</label>
        <input type="number" id="sshPort" value="22" min="1" max="65535">
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="sshUsername" placeholder="root">
      </div>

      <div class="section-title">SSH Key</div>

      <div class="form-group">
        <label class="form-label">Import from GitHub</label>
        <div class="github-import">
          <input type="text" id="githubUsername" placeholder="GitHub username">
          <button class="btn btn-secondary" id="importGithubKey">Import</button>
        </div>
        <div class="form-hint">Fetches your public SSH key from github.com/username.keys</div>
      </div>

      <div class="form-group">
        <label class="form-label">Private Key</label>
        <textarea id="sshPrivateKey" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----
...
-----END OPENSSH PRIVATE KEY-----"></textarea>
        <div class="form-hint">Paste your private key here (the public key should be authorized on the server)</div>
      </div>

      <div class="form-group">
        <label class="form-label">Or use Password</label>
        <input type="password" id="sshPassword" placeholder="Leave empty if using SSH key">
      </div>
    </div>

    <!-- Docker API Settings -->
    <div id="docker-settings" class="hidden">
      <div class="form-group">
        <label class="form-label">Docker Host</label>
        <input type="text" id="dockerHost" placeholder="192.168.1.100">
      </div>

      <div class="form-group">
        <label class="form-label">Port</label>
        <input type="number" id="dockerPort" value="2375" min="1" max="65535">
      </div>

      <div class="form-group">
        <label class="form-label">TLS Certificates Path (optional)</label>
        <input type="text" id="dockerCertPath" placeholder="C:\certs\docker">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="testConnection">Test Connection</button>
      <button class="btn btn-secondary" id="saveServer">Save</button>
    </div>
    <div id="connectionStatus"></div>
  </div>

  <!-- Container Tab -->
  <div class="tab-content" id="tab-container">
    <div class="section-title">Select Container</div>

    <div class="form-group">
      <label class="form-label">Container Name or ID</label>
      <input type="text" id="containerName" placeholder="plex, sonarr, radarr...">
    </div>

    <div class="form-group">
      <label class="form-label">Display Name (optional)</label>
      <input type="text" id="displayName" placeholder="Custom name on button">
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="refreshContainers">Refresh List</button>
    </div>

    <div id="containerList" class="container-list hidden">
      <div style="padding: 16px; text-align: center; color: #666;">Loading...</div>
    </div>
  </div>

  <!-- Action Tab -->
  <div class="tab-content" id="tab-action">
    <div class="section-title">Button Behavior</div>

    <div class="form-group" id="actionTypeGroup">
      <label class="form-label">Action on Press</label>
      <select id="actionType">
        <option value="toggle">Toggle (Start/Stop)</option>
        <option value="start">Start Only</option>
        <option value="stop">Stop Only</option>
        <option value="restart">Restart</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Refresh Interval (seconds)</label>
      <input type="number" id="refreshInterval" value="5" min="1" max="300">
      <div class="form-hint">How often to check container status</div>
    </div>

    <div class="form-group" id="logLinesGroup" class="hidden">
      <label class="form-label">Log Lines to Show</label>
      <input type="number" id="logLines" value="100" min="10" max="1000">
    </div>
  </div>

  <script>
    let websocket = null;
    let uuid = null;
    let actionInfo = null;
    let settings = {};
    let globalSettings = {};
    let currentAction = '';

    function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
      uuid = inUUID;
      actionInfo = JSON.parse(inActionInfo);
      settings = actionInfo.payload.settings || {};
      currentAction = actionInfo.action;

      websocket = new WebSocket('ws://127.0.0.1:' + inPort);

      websocket.onopen = function() {
        websocket.send(JSON.stringify({
          event: inRegisterEvent,
          uuid: inUUID
        }));

        // Request global settings
        websocket.send(JSON.stringify({
          event: 'getGlobalSettings',
          context: inUUID
        }));

        loadSettings();
        setupUI();
      };

      websocket.onmessage = function(evt) {
        const data = JSON.parse(evt.data);

        if (data.event === 'didReceiveGlobalSettings') {
          globalSettings = data.payload.settings || {};
          loadServerSettings();
        }

        if (data.event === 'didReceiveSettings') {
          settings = data.payload.settings || {};
          loadSettings();
        }

        if (data.event === 'sendToPropertyInspector') {
          handlePluginMessage(data.payload);
        }
      };
    }

    function setupUI() {
      // Hide/show elements based on action type
      const isLogs = currentAction.includes('logs');
      const isSettings = currentAction.includes('settings');
      const isStatus = currentAction.includes('status');

      // For settings action, only show server tab
      if (isSettings) {
        document.querySelector('[data-tab="container"]').classList.add('hidden');
        document.querySelector('[data-tab="action"]').classList.add('hidden');
      }

      // For status action, hide action type selector
      if (isStatus) {
        document.getElementById('actionTypeGroup').classList.add('hidden');
      }

      // For logs action, show log lines option
      if (isLogs) {
        document.getElementById('logLinesGroup').classList.remove('hidden');
        document.getElementById('actionTypeGroup').classList.add('hidden');
      }
    }

    function loadServerSettings() {
      const server = globalSettings.serverConfig || {};

      document.getElementById('connectionType').value = server.connectionType || 'ssh';
      document.getElementById('sshHost').value = server.sshHost || '';
      document.getElementById('sshPort').value = server.sshPort || 22;
      document.getElementById('sshUsername').value = server.sshUsername || '';
      document.getElementById('sshPrivateKey').value = server.sshPrivateKey || '';
      document.getElementById('sshPassword').value = server.sshPassword || '';
      document.getElementById('dockerHost').value = server.dockerHost || '';
      document.getElementById('dockerPort').value = server.dockerPort || 2375;
      document.getElementById('dockerCertPath').value = server.dockerCertPath || '';

      updateConnectionTypeUI();
    }

    function loadSettings() {
      document.getElementById('containerName').value = settings.containerName || settings.containerId || '';
      document.getElementById('displayName').value = settings.displayName || '';
      document.getElementById('actionType').value = settings.action || 'toggle';
      document.getElementById('refreshInterval').value = settings.refreshInterval || 5;
      document.getElementById('logLines').value = settings.logLines || 100;
    }

    function saveServerSettings() {
      const serverConfig = {
        connectionType: document.getElementById('connectionType').value,
        sshHost: document.getElementById('sshHost').value,
        sshPort: parseInt(document.getElementById('sshPort').value) || 22,
        sshUsername: document.getElementById('sshUsername').value,
        sshPrivateKey: document.getElementById('sshPrivateKey').value,
        sshPassword: document.getElementById('sshPassword').value,
        dockerHost: document.getElementById('dockerHost').value,
        dockerPort: parseInt(document.getElementById('dockerPort').value) || 2375,
        dockerCertPath: document.getElementById('dockerCertPath').value
      };

      globalSettings.serverConfig = serverConfig;

      if (websocket && websocket.readyState === 1) {
        websocket.send(JSON.stringify({
          event: 'setGlobalSettings',
          context: uuid,
          payload: globalSettings
        }));
      }

      showStatus('connectionStatus', 'Settings saved!', 'success');
    }

    function saveSettings() {
      settings = {
        containerName: document.getElementById('containerName').value,
        containerId: '',
        displayName: document.getElementById('displayName').value,
        action: document.getElementById('actionType').value,
        refreshInterval: parseInt(document.getElementById('refreshInterval').value) || 5,
        logLines: parseInt(document.getElementById('logLines').value) || 100
      };

      if (websocket && websocket.readyState === 1) {
        websocket.send(JSON.stringify({
          event: 'setSettings',
          context: uuid,
          payload: settings
        }));
      }
    }

    function updateConnectionTypeUI() {
      const type = document.getElementById('connectionType').value;
      document.getElementById('ssh-settings').classList.toggle('hidden', type !== 'ssh');
      document.getElementById('docker-settings').classList.toggle('hidden', type !== 'docker-api');
    }

    function showStatus(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.innerHTML = `<div class="status-badge status-${type}">${message}</div>`;
    }

    function handlePluginMessage(payload) {
      if (payload.containers) {
        displayContainers(payload.containers);
      }
      if (payload.connectionResult !== undefined) {
        showStatus('connectionStatus',
          payload.connectionResult ? 'Connected!' : 'Connection failed',
          payload.connectionResult ? 'success' : 'error'
        );
      }
      if (payload.githubKey) {
        // GitHub key imported - show the public key info
        showStatus('connectionStatus', 'GitHub key info fetched. Add your private key below.', 'info');
      }
    }

    function displayContainers(containers) {
      const list = document.getElementById('containerList');
      list.classList.remove('hidden');

      if (!containers || containers.length === 0) {
        list.innerHTML = '<div style="padding: 16px; text-align: center; color: #666;">No containers found</div>';
        return;
      }

      let html = '';
      containers.forEach(c => {
        const stateClass = c.state === 'running' ? 'running' : 'stopped';
        const selected = (settings.containerName === c.name || settings.containerId === c.id) ? 'selected' : '';
        html += `<div class="container-item ${selected}" data-name="${c.name}" data-id="${c.id}">
          <span class="container-name">${c.name}</span>
          <span class="container-state ${stateClass}">${c.state}</span>
        </div>`;
      });
      list.innerHTML = html;

      list.querySelectorAll('.container-item').forEach(item => {
        item.addEventListener('click', () => {
          document.getElementById('containerName').value = item.dataset.name;
          if (!document.getElementById('displayName').value) {
            document.getElementById('displayName').value = item.dataset.name;
          }
          // Update selected state
          list.querySelectorAll('.container-item').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');
          saveSettings();
        });
      });
    }

    async function importGithubKey() {
      const username = document.getElementById('githubUsername').value.trim();
      if (!username) {
        showStatus('connectionStatus', 'Enter a GitHub username', 'error');
        return;
      }

      showStatus('connectionStatus', 'Fetching from GitHub...', 'info');

      try {
        const response = await fetch(`https://github.com/${username}.keys`);
        if (response.ok) {
          const keys = await response.text();
          showStatus('connectionStatus',
            `Found ${keys.trim().split('\n').length} public key(s). Now paste your PRIVATE key below.`,
            'success'
          );
        } else {
          showStatus('connectionStatus', 'GitHub user not found or no keys', 'error');
        }
      } catch (err) {
        showStatus('connectionStatus', 'Failed to fetch from GitHub', 'error');
      }
    }

    // Event listeners
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('connectionType').addEventListener('change', updateConnectionTypeUI);
    document.getElementById('saveServer').addEventListener('click', saveServerSettings);

    document.getElementById('testConnection').addEventListener('click', () => {
      saveServerSettings();
      showStatus('connectionStatus', 'Testing connection...', 'info');
      if (websocket && websocket.readyState === 1) {
        websocket.send(JSON.stringify({
          event: 'sendToPlugin',
          context: uuid,
          payload: { action: 'testConnection' }
        }));
      }
    });

    document.getElementById('refreshContainers').addEventListener('click', () => {
      const list = document.getElementById('containerList');
      list.classList.remove('hidden');
      list.innerHTML = '<div style="padding: 16px; text-align: center; color: #666;">Loading...</div>';

      if (websocket && websocket.readyState === 1) {
        websocket.send(JSON.stringify({
          event: 'sendToPlugin',
          context: uuid,
          payload: { action: 'listContainers' }
        }));
      }
    });

    document.getElementById('importGithubKey').addEventListener('click', importGithubKey);

    // Auto-save on change
    ['containerName', 'displayName', 'actionType', 'refreshInterval', 'logLines'].forEach(id => {
      document.getElementById(id).addEventListener('change', saveSettings);
    });
  </script>
</body>
</html>
