<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Espace Disque Docker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #2D2D2D;
      color: #E8E8E8;
      margin: 0;
      padding: 12px;
    }
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #9E9E9E;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      color: #BDBDBD;
      margin-bottom: 4px;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1A1A1A;
      color: #E8E8E8;
      font-size: 12px;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #0078D4;
    }
    .info-box {
      background: #1A1A1A;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px;
      margin-top: 8px;
    }
    .info-text {
      font-size: 11px;
      color: #9E9E9E;
      line-height: 1.4;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #BDBDBD;
      cursor: pointer;
    }
    .checkbox-label input {
      width: auto;
    }
    .divider {
      height: 1px;
      background: #444;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="section">
    <div class="section-title">Espace Disque Docker</div>

    <div class="info-box">
      <div class="info-text">
        Affiche l'espace disque utilisé par Docker sur le serveur.<br><br>
        <strong>Appuyez sur le bouton</strong> pour rafraîchir les informations.
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Rafraîchissement</div>

    <div class="form-group">
      <label class="form-label">Intervalle de rafraîchissement (secondes)</label>
      <input type="number" id="refreshInterval" min="10" max="3600" value="60">
      <div style="font-size: 10px; color: #666; margin-top: 4px;">Minimum: 10s, Maximum: 3600s (1 heure)</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Affichage</div>

    <div class="form-group">
      <label class="form-label">Nom personnalisé (optionnel)</label>
      <input type="text" id="displayName" placeholder="Nom sur le bouton...">
    </div>

    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="showTitle" checked>
        <span>Afficher le titre</span>
      </label>
    </div>
  </div>

  <script>
    let $SD;

    function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
      const actionInfo = JSON.parse(inActionInfo);
      const settings = actionInfo.payload.settings || {};

      $SD = new WebSocket(`ws://127.0.0.1:${inPort}`);

      $SD.onopen = function() {
        $SD.send(JSON.stringify({
          event: inRegisterEvent,
          uuid: inPluginUUID
        }));

        loadSettings(settings);
      };

      $SD.onmessage = function(evt) {
        const data = JSON.parse(evt.data);
        if (data.event === "didReceiveSettings") {
          loadSettings(data.payload.settings || {});
        }
      };

      setupEventListeners(inPluginUUID);
    }

    function loadSettings(settings) {
      document.getElementById("refreshInterval").value = settings.refreshInterval || 60;
      document.getElementById("displayName").value = settings.displayName || "";
      document.getElementById("showTitle").checked = settings.showTitle !== false;
    }

    function setupEventListeners(uuid) {
      const refreshInterval = document.getElementById("refreshInterval");
      const displayName = document.getElementById("displayName");
      const showTitle = document.getElementById("showTitle");

      refreshInterval.addEventListener("change", () => saveSettings(uuid));
      displayName.addEventListener("input", () => saveSettings(uuid));
      showTitle.addEventListener("change", () => saveSettings(uuid));
    }

    function saveSettings(uuid) {
      let interval = parseInt(document.getElementById("refreshInterval").value) || 60;
      interval = Math.max(10, Math.min(3600, interval));
      document.getElementById("refreshInterval").value = interval;

      const settings = {
        refreshInterval: interval,
        displayName: document.getElementById("displayName").value,
        showTitle: document.getElementById("showTitle").checked
      };

      $SD.send(JSON.stringify({
        event: "setSettings",
        context: uuid,
        payload: settings
      }));
    }
  </script>
</body>
</html>
