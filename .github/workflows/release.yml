name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli

      - name: Package plugin
        run: streamdeck pack io.deckops.containers.sdPlugin --force

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: io.deckops.containers.streamDeckPlugin
          name: Docker Manager v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Docker Manager for Stream Deck v${{ steps.get_version.outputs.VERSION }}

            ### Installation
            1. Téléchargez le fichier `io.deckops.containers.streamDeckPlugin`
            2. Double-cliquez pour installer
            3. Configurez votre serveur Docker dans les paramètres du plugin

            ### Changelog
            Voir les commits pour les détails des changements.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
