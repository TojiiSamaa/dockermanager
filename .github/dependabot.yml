version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/io.deckops.containers.sdPlugin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-patch-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-patch-github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
